services:
  postgres:
    image: postgres:16
    container_name: expence-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expence}
      POSTGRES_DB: ${POSTGRES_DB:-expence_tracker}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-expence}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Задел под сервисы приложений — раскомментировать на этапе контейнеризации.
  # backend:
  #   build: ./backend
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #
  # frontend:
  #   build: ./frontend
  #   depends_on:
  #     - backend

volumes:
  postgres_data:
